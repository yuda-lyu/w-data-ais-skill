<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dryrun</title>
<style>
body { margin: 0; font-family: Arial, sans-serif; background: #fff; }
.top { height: 48px; background: #345; color: #fff; line-height: 48px; padding: 0 16px; }
.main { padding: 24px; }
.card { width: 360px; border: 1px solid #ccc; border-radius: 6px; padding: 16px; }
label { display: block; font-size: 14px; margin-bottom: 6px; }
input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
button { margin-top: 12px; padding: 8px 16px; }
#msg { margin-top: 12px; min-height: 20px; color: #060; font-size: 14px; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid #999; border-top-color: transparent; border-radius: 50%; animation: r 1s linear infinite; }
@keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="top" data-i18n="title">Dry Run</div>
<div class="main">
  <div class="card">
    <label for="name" data-i18n="label">Name</label>
    <input id="name" type="text">
    <button id="submit" data-i18n="btn">Submit</button>
    <div id="msg"></div>
    <span class="spin"></span>
  </div>
</div>
<script>
const KP = { eng: { title: 'Dry Run', label: 'Name', btn: 'Submit', hello: 'Hello, ' }, cht: { title: '試跑', label: '姓名', btn: '送出', hello: '你好, ' } }
let lang = 'eng'
window.setLang = (l) => { lang = l; document.querySelectorAll('[data-i18n]').forEach((e) => { e.textContent = KP[l][e.getAttribute('data-i18n')] }) }
window.ready = true
document.getElementById('submit').addEventListener('click', () => {
  const v = document.getElementById('name').value
  setTimeout(() => { document.getElementById('msg').textContent = KP[lang].hello + v }, 300) //delayed reveal
})
</script>
</body>
</html>
